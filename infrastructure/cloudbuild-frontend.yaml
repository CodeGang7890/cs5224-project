steps:
  - name: node:22
    dir: frontend-app
    entrypoint: npm
    args: ["ci"]
  - name: node:22
    dir: frontend-app
    entrypoint: bash
    args:
      - "-ceu"
      - |
        for name in VITE_CONFIGURATION_SERVICE_URL; do
          value="$${!name}"
          case "$$value" in
            https://*) ;;
            *) echo "Missing or invalid $$name in this build's substitutions" >&2; exit 1 ;;
          esac
          echo "Building with $$name=$$value"
        done
        npm run build
        for name in VITE_CONFIGURATION_SERVICE_URL; do
          value="$${!name}"
          grep -R -F -q -- "$$value" dist/assets || {
            echo "$$name was not embedded in the frontend bundle" >&2
            exit 1
          }
        done
    env:
      - "VITE_CONFIGURATION_SERVICE_URL=${_CONFIGURATION_SERVICE_URL}"
  - name: node:22
    entrypoint: bash
    args:
      - "-ceu"
      - "mkdir -p infrastructure/hosting-dist && cp -R frontend-app/dist/. infrastructure/hosting-dist/"
  - name: node:22
    dir: infrastructure
    entrypoint: bash
    args:
      - "-ceu"
      # Pinned: an unpinned install picks up new CLI releases, and 15.34.1 started checking the
      # Hosting API through Service Usage (the build account also has Service Usage Consumer, build.tf).
      - "npm install --global firebase-tools@15.34.0 && firebase deploy --only hosting --project=${_PROJECT_ID} --config=firebase.json --non-interactive"
options:
  logging: CLOUD_LOGGING_ONLY
