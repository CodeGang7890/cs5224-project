steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/notification-job:${SHORT_SHA}
      - ./notification-job
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/notification-job:${SHORT_SHA}
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - notification-job
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/notification-job:${SHORT_SHA}
      - --region=${_REGION}
      - --project=${_PROJECT_ID}
      - --quiet
images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/notification-job:${SHORT_SHA}
options:
  logging: CLOUD_LOGGING_ONLY
