# CI for configuration-service (Django), frontend-app (React) and the Python services (messaging-ingester,
# messaging-service, processing-service, notification-job). Runs on every pull request to
# main and every push to main. Branch protection on main requires the "CI passed" check, which only passes when every
# job below does (see the README's CI section).
#
# No `paths` filters on purpose: a required check that never runs (filtered out) would leave pull
# requests waiting forever.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request / branch cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14' # matches configuration-service/Dockerfile
  NODE_VERSION: '24' # LTS

jobs:
  # PostgreSQL only: it's what production (infrastructure/cloud_sql.tf) and docker-compose use.
  backend:
    name: configuration-service (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: configuration-service
    services:
      postgres:
        image: postgres:17-alpine # same as docker-compose.yml
        env:
          POSTGRES_DB: configuration_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_DB: configuration_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: configuration-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: System checks
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --file /tmp/schema.yml
      # What docker-entrypoint.sh does on a fresh database: every migration, then every fixture.
      - name: Migrate and load the fixtures
        run: |
          python manage.py migrate --noinput
          python manage.py loaddata sample_business_configurations sample_whatsapp_configurations sample_business_users sample_products sample_faqs sample_services sample_chat_configurations sample_chat_sessions sample_order_items sample_schedule_items sample_unanswered_questions
      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: frontend-app (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      # package-lock.json must download from the public registry: a lock file written behind a
      # private mirror (e.g. npm.apple.com) can't be installed here. npm still uses your own
      # registry locally (replace-registry-host).
      - name: Lock file uses the public npm registry
        run: |
          if grep -nE '"resolved": "https://' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'; then
            echo "::error file=frontend-app/package-lock.json::package-lock.json downloads from a private registry (above). Point those \"resolved\" URLs at https://registry.npmjs.org/ (see frontend-app/README.md)."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # tsc -b type-checks the whole app, then vite builds it.
      - name: Type-check and build
        run: npm run build

  # Each Python service's unit tests (python -m unittest), on the Python of its Dockerfile.
  python-services:
    name: ${{ matrix.service }} (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # report every service's result, not just the first failure
      matrix:
        service: [messaging-ingester, messaging-service, payment-ingester, processing-service, notification-job, mock_whatsapp]
        include:
          # Its EmulatorIntegrationTests publish to a real Pub/Sub emulator (skipped without one).
          - service: messaging-ingester
            pubsub-emulator: true
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Same image and command as docker-compose.yml's pubsub-emulator (a service container can't
      # be given a command, hence docker run).
      - name: Start the Pub/Sub emulator
        if: matrix.pubsub-emulator
        run: |
          docker run -d --name pubsub-emulator -p 8085:8085 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --project=local-project --host-port=0.0.0.0:8085
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8085 > /dev/null && exit 0
            sleep 2
          done
          docker logs pubsub-emulator
          echo "::error::The Pub/Sub emulator didn't start."
          exit 1
      - name: Tests
        env:
          PUBSUB_EMULATOR_HOST: ${{ matrix.pubsub-emulator && 'localhost:8085' || '' }}
        run: python -m unittest -v
      - name: Dead-letter forwarding (isolated emulator topics)
        if: matrix.pubsub-emulator
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: python ../evaluation/run_dead_letter.py --project local-project --timeout-seconds 90

  # configuration-service (Django) owns the PostgreSQL schema and every migration; messaging-service,
  # processing-service and notification-job map the tables they use with SQLAlchemy. Migrate a database with Django, then
  # check their models against it (tests/test_schema.py, skipped elsewhere).
  schema:
    name: SQLAlchemy models match Django's schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine # same as docker-compose.yml
        env:
          POSTGRES_DB: configuration_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCHEMA_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/configuration_service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            configuration-service/requirements.txt
            messaging-service/requirements.txt
            processing-service/requirements.txt
            notification-job/requirements.txt
      - name: Migrate with Django
        working-directory: configuration-service
        env:
          DJANGO_DB_ENGINE: postgresql
          POSTGRES_DB: configuration_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
      - name: messaging-service models
        working-directory: messaging-service
        run: |
          pip install -r requirements.txt
          python -m unittest -v tests.test_schema
      - name: processing-service models
        working-directory: processing-service
        run: |
          pip install -r requirements.txt
          python -m unittest -v tests.test_schema
      - name: notification-job models
        working-directory: notification-job
        run: |
          pip install -r requirements.txt
          python -m unittest -v tests.test_schema

  evaluation:
    name: Evaluation tooling (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Test measurement tools
        run: python -m unittest discover -s evaluation/tests -v

  # The one check branch protection requires: fails unless every job above succeeded (also when
  # one was cancelled or skipped), so new jobs only need adding to `needs`.
  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, frontend, python-services, schema, evaluation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::Not every CI job succeeded."
              exit 1
            fi
          done
