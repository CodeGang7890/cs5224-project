# Local development: PostgreSQL + configuration-service (Django, http://localhost:8000)
# + frontend-app (Vite dev server with hot reload, http://localhost:5173)
# + messaging-ingester (WhatsApp webhook → Pub/Sub, http://localhost:8002) + a local Pub/Sub emulator
# (pubsub-init creates its topics: WhatsApp messages and payment events)
# + messaging-service (Gunicorn; the chat flow (Chat Sandbox messages), LLM chat, and the pull consumer of the ingester's
#   messages, http://localhost:8004).
# + processing-service (Gunicorn; pull consumer of the payment events: updates the orders / bookings, http://localhost:8003)
# + notification-job (payment and appointment reminders, logged for now; run every hour by cron).
# The database is kept in the postgres-data volume between runs; the sample fixtures are loaded the
# first time. To wipe it and reload them: RESET_DB=true docker compose up
# (see configuration-service/docker-entrypoint.sh).

x-postgres-env: &postgres-env
  POSTGRES_DB: configuration_service
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

services:
  postgres:
    image: postgres:17-alpine
    environment: *postgres-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5433 on the host, so it doesn't clash with a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d configuration_service"]
      interval: 2s
      timeout: 5s
      retries: 15

  configuration-service:
    build: ./configuration-service
    ports:
      - "8000:8000"
    environment:
      <<: *postgres-env
      # true: flush the database and reload every sample fixture on start. false (default): keep the data.
      RESET_DB: ${RESET_DB:-false}
      # configuration-service is how other containers (messaging-ingester) reach it.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,configuration-service
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # WhatsApp connection (configuration_app.WhatsAppConfiguration). Local-development values only.
      CONFIGURATION_ENCRYPTION_KEY: dev-whatsapp-encryption-key # encrypts the stored WhatsApp secrets
      INTERNAL_API_KEY: dev-internal-api-key # messaging-ingester sends it to /api/internal/
      JWT_SIGNING_KEY: &jwt-signing-key dev-jwt-signing-key-local-only-change-me # signs logins; messaging-service checks them
      MESSAGING_INGESTER_PUBLIC_URL: http://localhost:8002 # shown to owners as their webhook Callback URL
      # Meta's Graph API, used to check the WhatsApp details owners enter (override to point at a fake for testing).
      META_GRAPH_API_URL: ${META_GRAPH_API_URL:-https://graph.facebook.com/v25.0}
    extra_hosts:
      - "host.docker.internal:host-gateway" # for Linux; Docker Desktop has it already
    depends_on:
      postgres:
        condition: service_healthy

  frontend-app:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # Called from the browser, not from inside Docker, so it's localhost rather than configuration-service.
      VITE_CONFIGURATION_SERVICE_URL: http://localhost:8000/api
      VITE_MESSAGING_SERVICE_URL: http://localhost:8004/api # the Chat Sandbox's messages (the chat flow)
      # File change events don't cross into the container on WSL/Windows: poll (see vite.config.ts).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend-app:/app # the source, for hot reload
      - /app/node_modules # keep the container's node_modules (the host may have none, or other platform binaries)
    depends_on:
      - configuration-service

  # Local stand-in for Google Cloud Pub/Sub. Data lives in memory: it's lost on restart.
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=local-project --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs once the emulator is up, creates the queues' topics (as Terraform would on Google Cloud), and
  # exits. The services wait for it. Consumers create their own subscriptions.
  #   whatsapp-inbound-messages: messaging-ingester → messaging-service
  #   payment-events: payment-ingester (for now: payment-ingester/scripts/publish_dummy_payments.py) → processing-service
  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators # already pulled for the emulator; has curl
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for topic in whatsapp-inbound-messages payment-events; do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT "http://pubsub-emulator:8085/v1/projects/local-project/topics/$$topic")
          case "$$code" in
            200) echo "Created topic $$topic" ;;
            409) echo "Topic $$topic already exists" ;;
            *) echo "Creating topic $$topic failed: HTTP $$code"; exit 1 ;;
          esac
        done
    depends_on:
      pubsub-emulator:
        condition: service_healthy

  messaging-ingester:
    build: ./messaging-ingester
    ports:
      - "8002:8002"
    environment:
      CONFIGURATION_SERVICE_URL: http://configuration-service:8000/api # TODO: Change to a real configuration-service URL when deploying to Google Cloud Run
      INTERNAL_API_KEY: dev-internal-api-key # must equal configuration-service's
      GCP_PROJECT_ID: local-project # TODO: Change to a real GCP project ID when deploying to Google Cloud Pub/Sub
      # TODO: Don't set this in production so the ingester use the real Google Cloud Pub/Sub service instead of the emulator
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
      configuration-service:
        condition: service_started

  messaging-service:
    build: ./messaging-service
    ports:
      - "8004:8004"
    environment:
      WEB_CONCURRENCY: "2" # Gunicorn workers; each runs a Pub/Sub consumer, and they share the messages
      # Ollama runs on the host machine, not in Docker (see the root README, "Local LLM"). Override the
      # address in a root .env file, e.g. OLLAMA_HOST=http://192.168.64.1:11434 on a vessel VM.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Pull consumer of the customer messages messaging-ingester publishes: answered by the chat flow (app/inbound.py).
      PUBSUB_CONSUMER_ENABLED: "true"
      GCP_PROJECT_ID: local-project # TODO: a real GCP project ID when deploying to Google Cloud Pub/Sub
      PUBSUB_TOPIC: whatsapp-inbound-messages
      PUBSUB_SUBSCRIPTION: messaging-service-inbound
      # TODO: Don't set this in production, so the real Google Cloud Pub/Sub is used instead of the emulator
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      # The chat flow (moved from configuration-service): its database, logins and the browser's origin.
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SCHEDULE_TIME_ZONE: Asia/Singapore # must equal configuration-service's (DJANGO_SCHEDULE_TIME_ZONE)
      JWT_SIGNING_KEY: *jwt-signing-key # must equal configuration-service's
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173 # the frontend's Chat Sandbox
      # Replies to WhatsApp messages go out through configuration-service (it holds the access tokens).
      CONFIGURATION_SERVICE_URL: http://configuration-service:8000/api
      INTERNAL_API_KEY: dev-internal-api-key # must equal configuration-service's
    extra_hosts:
      - "host.docker.internal:host-gateway" # for Linux; Docker Desktop has it already
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      configuration-service: # its migrations create the tables
        condition: service_started

  processing-service:
    build: ./processing-service
    ports:
      - "8003:8003"
    environment:
      WEB_CONCURRENCY: "2" # Gunicorn workers; each runs a Pub/Sub consumer, and they share the messages
      # Pull consumer of the payment events (app/consumer.py).
      PUBSUB_CONSUMER_ENABLED: "true"
      GCP_PROJECT_ID: local-project # TODO: a real GCP project ID when deploying to Google Cloud Pub/Sub
      PUBSUB_TOPIC: payment-events
      PUBSUB_SUBSCRIPTION: processing-service-payments
      # TODO: Don't set this in production, so the real Google Cloud Pub/Sub is used instead of the emulator
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      # configuration-service's database: the payment flow updates the orders / bookings (app/payments.py).
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SCHEDULE_TIME_ZONE: Asia/Singapore # must equal configuration-service's (DJANGO_SCHEDULE_TIME_ZONE)
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      configuration-service: # its migrations create the tables
        condition: service_started

  # The job runs once and exits; this container is its cron, running it every hour (cron.sh).
  notification-job:
    build: ./notification-job
    command: ["./cron.sh"]
    environment:
      <<: *postgres-env # configuration-service's database (read-only use)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SCHEDULE_TIME_ZONE: Asia/Singapore # the times in the reminders (configuration-service's DJANGO_SCHEDULE_TIME_ZONE)
      CRON_SCHEDULE: ${NOTIFICATION_JOB_SCHEDULE:-0 * * * *} # every hour (UTC); e.g. "* * * * *" to try it
    depends_on:
      postgres:
        condition: service_healthy
      configuration-service: # its migrations create the tables
        condition: service_started

volumes:
  postgres-data:
